# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.c_compiler }} ${{ matrix.build_type }} selection ${{ matrix.per_view_select }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Build Release and Debug with MSVC, GCC and Clang. Fortify is enabled
      # later for Debug builds except the stock Clang configuration.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release, Debug]
        c_compiler: [gcc, clang, cl]
        per_view_select: ["ON"]
        include:
          - os: windows-latest
            c_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: gcc
            build_type: Debug
            per_view_select: "OFF"
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Cache verified game archive
      uses: actions/cache@v4
      with:
        path: build/tests/SFEditor-game-data/sf3000.zip
        key: sfeditor-game-data-4f4eff756d475bd5-build-${{ runner.os }}-${{ matrix.build_type }}

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DWARNINGS_AS_ERRORS=ON
        -DUSE_OPTIONAL=OFF
        -DSFEDITOR_TEST_COVERAGE=${{ matrix.c_compiler == 'gcc' && matrix.build_type == 'Debug' && matrix.per_view_select == 'ON' }}
        -DPER_VIEW_SELECT=${{ matrix.per_view_select }}
        -DUSE_FORTIFY=${{ matrix.build_type == 'Debug' && matrix.c_compiler != 'clang' }}
        -S ${{ github.workspace }}

    - name: Build
      id: build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      shell: bash
      run: cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }} 2>&1 | tee "${{ steps.strings.outputs.build-output-dir }}/build.log"

    - name: Test
      id: test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      shell: bash
      run: ctest --build-config ${{ matrix.build_type }} --verbose --output-junit test-results.xml 2>&1 | tee test.log

    - name: Portable-test coverage
      if: ${{ !cancelled() && matrix.c_compiler == 'gcc' && matrix.build_type == 'Debug' && matrix.per_view_select == 'ON' }}
      shell: bash
      run: |
        python -m pip install gcovr==8.8
        mkdir -p build/coverage
        gcovr --root . --filter "$GITHUB_WORKSPACE/" --exclude 'tests/' --exclude 'build/' \
          --html-details build/coverage/index.html --xml build/coverage/coverage.xml \
          --markdown-summary build/coverage/summary.md --json-summary build/coverage/summary.json \
          --txt-summary > build/coverage/summary.txt

    - name: Job summary
      if: always()
      shell: bash
      run: |
        echo '## Portable-test results' >> "$GITHUB_STEP_SUMMARY"
        echo 'Build: ${{ steps.build.outcome }}; tests: ${{ steps.test.outcome }}' >> "$GITHUB_STEP_SUMMARY"
        for report in build/tests/SFEditor-game-data/summary-*.md; do
          if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
        done
        if test -f build/coverage/summary.txt; then
          echo '### Model, parser and selection coverage (including untested editing, saving and error paths)' >> "$GITHUB_STEP_SUMMARY"
          cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: diagnostics-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}-selection-${{ matrix.per_view_select }}
        if-no-files-found: warn
        path: |
          build/build.log
          build/test.log
          build/test-results.xml
          build/Testing/Temporary/
          build/tests/SFEditor-game-data/logs/
          build/tests/SFEditor-game-data/summary-*.md
          build/coverage/

  optional-clang:
    name: _Optional Clang ${{ matrix.build_type }} Fortify ${{ matrix.use_fortify }} selection ${{ matrix.per_view_select }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            use_fortify: "OFF"
            per_view_select: "OFF"
          - build_type: Release
            use_fortify: "OFF"
            per_view_select: "ON"
          - build_type: Debug
            use_fortify: "ON"
            per_view_select: "OFF"
          - build_type: Debug
            use_fortify: "ON"
            per_view_select: "ON"

    env:
      OPTIONAL_CLANG_TAG: v1.0.12-optional
      OPTIONAL_CLANG_PLATFORM: linux-x86_64
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache verified game archive
        uses: actions/cache@v4
        with:
          path: build-optional-${{ matrix.build_type }}/tests/SFEditor-game-data/sf3000.zip
          key: sfeditor-game-data-4f4eff756d475bd5-optional-${{ runner.os }}-${{ matrix.build_type }}

      - name: Download _Optional Clang
        shell: bash
        run: |
          archive="clang+llvm-${OPTIONAL_CLANG_TAG}-${OPTIONAL_CLANG_PLATFORM}.tar.xz"
          toolchain="$RUNNER_TEMP/optional-clang"

          mkdir -p "$toolchain"

          gh release download "$OPTIONAL_CLANG_TAG" \
            --repo chrisbazley/llvm-project \
            --pattern "$archive" \
            --pattern "$archive.sha256" \
            --dir "$RUNNER_TEMP"

          cd "$RUNNER_TEMP"
          sha256sum --check "$archive.sha256"
          tar -xJf "$archive" -C "$toolchain"

          echo "OPTIONAL_CLANG_ROOT=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          test "$(command -v clang)" = "$OPTIONAL_CLANG_ROOT/bin/clang"
          test "$(command -v clang-tidy)" = \
            "$OPTIONAL_CLANG_ROOT/bin/clang-tidy"

          clang --version
          clang-tidy --version

          clang-tidy \
            --list-checks \
            --checks='-*,clang-analyzer-optionality.OptionalityChecker' |
            grep -F 'clang-analyzer-optionality.OptionalityChecker'

          cat > "$RUNNER_TEMP/optional-smoke-test.c" <<'EOF'
          int value_or_zero(_Optional int *value) {
            return value ? *value : 0;
          }
          EOF

          clang -std=c99 \
            -fsyntax-only \
            "$RUNNER_TEMP/optional-smoke-test.c"

      - name: Configure with _Optional
        shell: bash
        run: |
          cmake \
            -S "$GITHUB_WORKSPACE" \
            -B "$GITHUB_WORKSPACE/build-optional-${{ matrix.build_type }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER="$OPTIONAL_CLANG_ROOT/bin/clang" \
            -DCLANG_TIDY_EXE="$OPTIONAL_CLANG_ROOT/bin/clang-tidy" \
            -DWARNINGS_AS_ERRORS=ON \
            -DUSE_OPTIONAL=ON \
            -DPER_VIEW_SELECT=${{ matrix.per_view_select }} \
            -DUSE_FORTIFY=${{ matrix.use_fortify }} \
            -DENABLE_CLANG_TIDY=ON

      - name: Build and analyze
        id: build
        shell: bash
        run: |
          cmake \
            --build "$GITHUB_WORKSPACE/build-optional-${{ matrix.build_type }}" \
            --parallel 2 2>&1 | tee "$GITHUB_WORKSPACE/build-optional-${{ matrix.build_type }}/build.log"

      - name: Test
        id: test
        shell: bash
        run: |
          ctest \
            --test-dir "$GITHUB_WORKSPACE/build-optional-${{ matrix.build_type }}" \
            --build-config ${{ matrix.build_type }} \
            --verbose --output-junit "$GITHUB_WORKSPACE/build-optional-${{ matrix.build_type }}/test-results.xml" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-optional-${{ matrix.build_type }}/test.log"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          echo '## _Optional portable-test results' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build: ${{ steps.build.outcome }}; tests: ${{ steps.test.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          for report in build-optional-${{ matrix.build_type }}/tests/SFEditor-game-data/summary-*.md; do
            if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          echo 'Build logs, per-resource logs and JUnit results are in the diagnostics artifact.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-optional-${{ matrix.build_type }}-fortify-${{ matrix.use_fortify }}-selection-${{ matrix.per_view_select }}
          if-no-files-found: warn
          path: |
            build-optional-${{ matrix.build_type }}/build.log
            build-optional-${{ matrix.build_type }}/test.log
            build-optional-${{ matrix.build_type }}/test-results.xml
            build-optional-${{ matrix.build_type }}/Testing/Temporary/
            build-optional-${{ matrix.build_type }}/tests/SFEditor-game-data/logs/
            build-optional-${{ matrix.build_type }}/tests/SFEditor-game-data/summary-*.md
